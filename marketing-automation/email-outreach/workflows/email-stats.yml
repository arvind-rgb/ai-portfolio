# Bhookle Email Stats
# Auto-generated by email-outreach skill on 2026-05-23
# DO NOT EDIT MANUALLY — regenerate via gen_github_actions.py

name: Bhookle Email Stats

on:
  # Primary: external scheduler (cron-job.org) at 07:00 IST. Bypasses GH cron throttling.
  repository_dispatch:
    types: [email_stats]
  workflow_dispatch:
  # 2026-06-09 cost-cut: dropped GH-cron backup. cron-job.org dispatch is the
  # primary path; if a run fails, user gets an emailed alert from the
  # failure-notify step and triggers manually from the GH UI.

permissions:
  contents: write

jobs:
  stats:
    name: Fetch stats and update master workbook
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests openpyxl pytz python-dotenv

      - name: Fetch stats from Resend
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          python3 _skills/email-outreach/scripts/fetch_stats.py --days 7

      - name: Update master workbook
        run: |
          python3 _skills/email-outreach/scripts/update_master_xlsx.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add email-marketing/campaigns/*/results.json email-marketing/campaigns-master.xlsx || true
          git diff --staged --quiet || git commit -m "chore: email stats update ${{ github.run_id }}"
          git push || true

      - name: Build digest text + subject
        id: digest
        run: |
          python3 _skills/email-outreach/scripts/format_stats_digest.py > stats-digest.txt
          cat stats-digest.txt
          # Subject line: include today's date in IST for inbox grouping
          DATE_IST=$(TZ=Asia/Kolkata date +'%a %b %d')
          echo "subject=📧 Bhookle Email Stats — ${DATE_IST}" >> $GITHUB_OUTPUT

      - name: Email the digest
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: ${{ steps.digest.outputs.subject }}
          to: ${{ secrets.GMAIL_USER }}
          from: Bhookle Email Bot <${{ secrets.GMAIL_USER }}>
          body: file://stats-digest.txt
          attachments: email-marketing/campaigns-master.xlsx

      - name: Email me on workflow failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "⚠️ Bhookle workflow failed: ${{ github.workflow }}"
          to: ${{ secrets.GMAIL_USER }}
          from: Bhookle Bot <${{ secrets.GMAIL_USER }}>
          body: |
            Workflow: ${{ github.workflow }}
            Run ID: ${{ github.run_id }}
            URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Manual intervention needed.
