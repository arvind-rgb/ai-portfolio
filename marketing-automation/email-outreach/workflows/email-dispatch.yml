# Bhookle Email Dispatch
# Auto-generated by email-outreach skill on 2026-05-23
# DO NOT EDIT MANUALLY — regenerate via gen_github_actions.py

name: Bhookle Email Dispatch

on:
  # Manual trigger only — automatic dispatch is handled by the Social Tick Dispatcher
  # (bhookle-social-tick.yml) which runs every 15 min and is far more reliable.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dispatch:
    name: Dispatch today's email batches
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests openpyxl pytz python-dotenv google-genai

      - name: Upload campaign images to Cloudinary
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          for slug in email-marketing/campaigns/*/; do
            slug_name=$(basename "$slug")
            echo "Uploading images for: $slug_name"
            python3 _skills/email-outreach/scripts/upload_images.py "$slug_name"
          done

      - name: Dispatch batch
        id: dispatch
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_ADMIN_RECIPIENT: owner@example.com
        run: |
          python3 _skills/email-outreach/scripts/dispatch_batch.py 2>&1 | tee dispatch-output.log
          # Count emails actually sent in this run (any line containing "✓ sent" or "Sent to")
          SENT_COUNT=$(grep -cE "✓ sent|Sent to" dispatch-output.log || true)
          echo "sent_count=${SENT_COUNT}" >> $GITHUB_OUTPUT

      - name: Commit logs and image URLs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add email-marketing/campaigns/*/sent-log.csv \
                  email-marketing/campaigns/*/image-urls.json || true
          git diff --staged --quiet || git commit -m "chore: email dispatch log ${{ github.run_id }}"
          git push || true

      # Dispatch report is sent by dispatch_batch.py via Gmail SMTP (only when emails actually sent)

      - name: Email me on workflow failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "⚠️ Bhookle workflow failed: ${{ github.workflow }}"
          to: ${{ secrets.GMAIL_USER }}
          from: Bhookle Bot <${{ secrets.GMAIL_USER }}>
          body: |
            Workflow: ${{ github.workflow }}
            Run ID: ${{ github.run_id }}
            URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Manual intervention needed.
